<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="36" height="16" viewBox="0 0 36 16">
  <!-- Pichhwai-style band for the coloured sections: open lotuses on a lotus vine. Original drawing. -->
  <defs>
    <radialGradient id="pk" cx=".5" cy=".5" r=".55">
      <stop offset="0" stop-color="#fde3ea"/><stop offset=".55" stop-color="#f19ab4"/><stop offset="1" stop-color="#d4547d"/>
    </radialGradient>
    <path id="pt" d="M0 0C1.9-1.7 2.2-4.2 0-6.6C-2.2-4.2-1.9-1.7 0 0Z"/>
    <path id="leaf" d="M0 0C1.6-1.9 4.6-2.5 7-1.2C4.9.8 1.9 1 0 0Z"/>
  </defs>
  <rect width="36" height="16" fill="#0f3e3c"/>
  <path d="M0 8C5.4 3.6 12.6 3.6 18 8S30.6 12.4 36 8" fill="none" stroke="#d9ac4a" stroke-width=".7"/>
  <g fill="#3f8f52" stroke="#2a6a3a" stroke-width=".3">
    <use xlink:href="#leaf" transform="translate(8 4.9) rotate(-150)"/>
    <use xlink:href="#leaf" transform="translate(28 11.1) rotate(30)"/>
  </g>
  <g transform="translate(18 8)">
    <g fill="url(#pk)" stroke="#a5345d" stroke-width=".35">
      <use xlink:href="#pt"/><use xlink:href="#pt" transform="rotate(45)"/><use xlink:href="#pt" transform="rotate(90)"/><use xlink:href="#pt" transform="rotate(135)"/>
      <use xlink:href="#pt" transform="rotate(180)"/><use xlink:href="#pt" transform="rotate(225)"/><use xlink:href="#pt" transform="rotate(270)"/><use xlink:href="#pt" transform="rotate(315)"/>
    </g>
    <circle r="1.8" fill="#f2c14e" stroke="#9b6a12" stroke-width=".4"/>
  </g>
  <g fill="#f2c96a"><circle cx="3" cy="11" r=".7"/><circle cx="33" cy="5" r=".7"/></g>
</svg>
