<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="120" height="120" viewBox="0 0 120 120">
  <!-- Pichhwai-style page border (used as a 9-slice border-image, slice 40):
       gold rules, a burgundy strip with gold dots, a deep-teal field with a lotus vine,
       gold scallops on the inside. Corners carry a full open lotus. Original drawing. -->
  <defs>
    <radialGradient id="pk" cx=".5" cy=".5" r=".55">
      <stop offset="0" stop-color="#fde3ea"/><stop offset=".55" stop-color="#f19ab4"/><stop offset="1" stop-color="#d4547d"/>
    </radialGradient>
    <!-- one petal, pointing up from the centre -->
    <path id="pt" d="M0 0C2.5-2.2 2.9-5.6 0-8.8C-2.9-5.6-2.5-2.2 0 0Z"/>
    <path id="pti" d="M0 0C1.8-1.6 2-4 0-6C-2-4-1.8-1.6 0 0Z"/>
    <!-- open lotus seen from above -->
    <g id="rose">
      <g fill="url(#pk)" stroke="#a5345d" stroke-width=".45">
        <use xlink:href="#pt"/><use xlink:href="#pt" transform="rotate(45)"/><use xlink:href="#pt" transform="rotate(90)"/><use xlink:href="#pt" transform="rotate(135)"/>
        <use xlink:href="#pt" transform="rotate(180)"/><use xlink:href="#pt" transform="rotate(225)"/><use xlink:href="#pt" transform="rotate(270)"/><use xlink:href="#pt" transform="rotate(315)"/>
      </g>
      <g fill="#fff1f4" stroke="#d06a8c" stroke-width=".35">
        <use xlink:href="#pti" transform="rotate(22.5)"/><use xlink:href="#pti" transform="rotate(67.5)"/><use xlink:href="#pti" transform="rotate(112.5)"/><use xlink:href="#pti" transform="rotate(157.5)"/>
        <use xlink:href="#pti" transform="rotate(202.5)"/><use xlink:href="#pti" transform="rotate(247.5)"/><use xlink:href="#pti" transform="rotate(292.5)"/><use xlink:href="#pti" transform="rotate(337.5)"/>
      </g>
      <circle r="2.3" fill="#f2c14e" stroke="#9b6a12" stroke-width=".5"/>
      <g fill="#9b6a12"><circle cx="0" cy="-1" r=".35"/><circle cx=".95" cy=".45" r=".35"/><circle cx="-.95" cy=".45" r=".35"/></g>
    </g>
    <path id="leaf" d="M0 0C2.2-2.6 6.2-3.4 9.4-1.6C6.6 1 2.6 1.4 0 0Z"/>
    <!-- a straight run of border, 40 long; outside edge at y=0 -->
    <g id="edge">
      <rect width="40" height="2" fill="#c8962f"/>
      <rect y="2" width="40" height="4" fill="#7c1733"/>
      <g fill="#f2c96a"><circle cx="5" cy="4" r=".85"/><circle cx="15" cy="4" r=".85"/><circle cx="25" cy="4" r=".85"/><circle cx="35" cy="4" r=".85"/></g>
      <rect y="6" width="40" height="1.3" fill="#c8962f"/>
      <rect y="7.3" width="40" height="23.9" fill="#0f3e3c"/>
      <rect y="31.2" width="40" height="1.3" fill="#c8962f"/>
      <!-- lotus vine -->
      <path d="M0 19.2C6 13.2 14 13.2 20 19.2S34 25.2 40 19.2" fill="none" stroke="#d9ac4a" stroke-width=".9"/>
      <g fill="#3f8f52" stroke="#2a6a3a" stroke-width=".35">
        <use xlink:href="#leaf" transform="translate(9 14.8) rotate(-150)"/>
        <use xlink:href="#leaf" transform="translate(31 23.6) rotate(30)"/>
      </g>
      <g fill="#f2c96a"><circle cx="3.5" cy="22.5" r=".8"/><circle cx="36.5" cy="15.9" r=".8"/></g>
      <use xlink:href="#rose" transform="translate(20 19.2) scale(1.02)"/>
      <!-- gold scallops on the paper side -->
      <path d="M0 32.5A5 4.2 0 0 0 10 32.5A5 4.2 0 0 0 20 32.5A5 4.2 0 0 0 30 32.5A5 4.2 0 0 0 40 32.5" fill="none" stroke="#b8862b" stroke-width=".8"/>
      <g fill="#b8862b"><circle cx="5" cy="38" r="1"/><circle cx="15" cy="38" r="1"/><circle cx="25" cy="38" r="1"/><circle cx="35" cy="38" r="1"/></g>
    </g>
    <!-- top-left corner, 40 x 40 -->
    <g id="corner">
      <path d="M0 0H40V2H2V40H0Z" fill="#c8962f"/>
      <path d="M2 2H40V6H6V40H2Z" fill="#7c1733"/>
      <path d="M6 6H40V7.3H7.3V40H6Z" fill="#c8962f"/>
      <path d="M7.3 7.3H40V31.2H31.2V40H7.3Z" fill="#0f3e3c"/>
      <path d="M31.2 40V31.2H40V32.5H32.5V40Z" fill="#c8962f"/>
      <g fill="#f2c96a"><circle cx="4" cy="4" r="1.1"/><circle cx="15" cy="4" r=".85"/><circle cx="25" cy="4" r=".85"/><circle cx="35" cy="4" r=".85"/><circle cx="4" cy="15" r=".85"/><circle cx="4" cy="25" r=".85"/><circle cx="4" cy="35" r=".85"/></g>
      <path d="M40 19.2H28M19.2 40V28" stroke="#d9ac4a" stroke-width=".9"/>
      <circle cx="19.2" cy="19.2" r="10.4" fill="none" stroke="#d9ac4a" stroke-width=".7"/>
      <g fill="#3f8f52" stroke="#2a6a3a" stroke-width=".35">
        <use xlink:href="#leaf" transform="translate(19.2 19.2) rotate(45) translate(8.5 0) scale(.7)"/>
        <use xlink:href="#leaf" transform="translate(19.2 19.2) rotate(-135) translate(8.5 0) scale(.7)"/>
      </g>
      <use xlink:href="#rose" transform="translate(19.2 19.2) scale(1.12)"/>
    </g>
  </defs>
  <use xlink:href="#corner"/>
  <use xlink:href="#corner" transform="translate(120 0) scale(-1 1)"/>
  <use xlink:href="#corner" transform="translate(0 120) scale(1 -1)"/>
  <use xlink:href="#corner" transform="translate(120 120) scale(-1 -1)"/>
  <use xlink:href="#edge" transform="translate(40 0)"/>
  <use xlink:href="#edge" transform="translate(80 120) rotate(180)"/>
  <use xlink:href="#edge" transform="translate(0 80) rotate(-90)"/>
  <use xlink:href="#edge" transform="translate(120 40) rotate(90)"/>
</svg>
