<!doctype html>
<html lang="en" data-theme="burgundy" data-build="20261113132751" data-script="luxurious">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Send invitations</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- only the script font the workbook picks is actually downloaded -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Cormorant+SC:wght@500;600&family=Corinthia:wght@400;700&family=Pinyon+Script&family=Imperial+Script&family=Luxurious+Script&display=swap">
  <link rel="stylesheet" href="style.css?v=20261113132751">
  <style>
    /* ---------- the page: the invitation's silk, with ivory cards on it ---------- */
    body.sp { min-height: 100vh; background: var(--silk-2); color: var(--silk-ink); }
    body.sp::before {
      content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: var(--pattern) 0 0 / 64px 64px, radial-gradient(130% 70% at 50% 0%, var(--silk-1) 0%, var(--silk-2) 78%);
    }
    .sp-patola { height: 18px; border-top: 1px solid var(--gold-s); border-bottom: 1px solid var(--gold-s); background: var(--patola) repeat-x center / 28px 16px; box-shadow: 0 2px 8px rgba(0, 0, 0, .35); }
    .send { max-width: 620px; margin: 0 auto; padding: 22px 16px 56px; }

    /* header: crest, title, progress */
    .sp-head { position: relative; text-align: center; }
    .sp-head::before { content: ''; position: absolute; left: 50%; top: -10px; z-index: -1; width: 300px; height: 260px; translate: -50% 0; background: radial-gradient(closest-side, rgba(255, 214, 140, .2), rgba(255, 214, 140, 0)); pointer-events: none; }
    .sp-crest { display: block; width: 148px; height: auto; margin: 0 auto; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .35)); }
    .sp-title { margin: 0; font-size: calc(46px * var(--script-k, 1)); line-height: 1.1; }
    .sp-sub { margin: 2px 0 0; font-family: var(--caps); font-size: 12px; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; color: var(--silk-soft); }
    .sp-divider { display: block; width: 220px; height: 16px; margin: 14px auto 16px; color: var(--gold-s); }
    .sp-stats { display: grid; grid-template-columns: repeat(3, 1fr); max-width: 420px; margin: 0 auto; }
    .sp-stat { padding: 2px 6px; }
    .sp-stat + .sp-stat { border-left: 1px solid var(--line-s); }
    .sp-stat b { display: block; font-family: var(--caps); font-size: 34px; font-weight: 600; line-height: 1; }
    .sp-stat span { display: block; margin-top: 6px; font-family: var(--caps); font-size: 11.5px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--silk-soft); }
    .sp-progress { max-width: 420px; height: 8px; margin: 16px auto 0; padding: 1px; border: 1px solid var(--line-s); border-radius: 999px; background: rgba(0, 0, 0, .25); }
    .sp-progress i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--gs1), var(--gs2) 40%, var(--gs3) 60%, var(--gs2)); box-shadow: 0 0 8px rgba(255, 214, 140, .45); transition: width .5s ease; }

    /* search and filter */
    .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 26px 0 16px; }
    .search { position: relative; flex: 1 1 220px; }
    .search svg { position: absolute; left: 15px; top: 50%; width: 18px; height: 18px; translate: 0 -50%; color: var(--gold-p); pointer-events: none; }
    .search input { box-sizing: border-box; width: 100%; min-height: 46px; padding: 8px 16px 8px 42px; border: 1px solid var(--gold-s); border-radius: 999px; background: var(--paper); color: var(--ink); font: 500 17px var(--serif); box-shadow: inset 0 1px 3px rgba(0, 0, 0, .12); }
    .search input::placeholder { color: var(--ink-soft); font-style: italic; }
    .search input:focus { outline: 2px solid var(--gs2); outline-offset: 2px; }
    .tools label { display: flex; align-items: center; gap: 8px; font-family: var(--caps); font-size: 15px; font-weight: 600; letter-spacing: .08em; color: var(--silk-ink); white-space: nowrap; }
    .tools input[type="checkbox"] { width: 20px; height: 20px; margin: 0; accent-color: var(--gs2); }

    /* guest cards: ivory, with a gold frame inside */
    .guest-row {
      --gold: var(--gold-p); --line: var(--line-p);
      position: relative; display: grid; gap: 12px; margin-bottom: 16px; padding: 18px 18px 16px;
      border: 1px solid var(--gold-p); border-radius: 16px; color: var(--ink);
      background: radial-gradient(120% 70% at 50% 0%, #fffdf8, var(--paper) 70%);
      box-shadow: 0 12px 28px rgba(0, 0, 0, .32), 0 1px 0 rgba(255, 255, 255, .5) inset;
    }
    .guest-row::before { content: ''; position: absolute; inset: 5px; border: 1px solid var(--line-p); border-radius: 12px; pointer-events: none; }
    .guest-row::after { content: ''; position: absolute; left: 50%; top: -6px; width: 10px; height: 10px; translate: -50% 0; rotate: 45deg; background: linear-gradient(135deg, var(--gs3), var(--gs2) 50%, var(--gs1)); box-shadow: 0 0 0 2px var(--silk-2); }
    .row-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .row-name { font-size: 1.36rem; font-weight: 700; line-height: 1.2; color: var(--ink); }
    .row-seats { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 1rem; font-style: italic; color: var(--ink-soft); }
    .row-seats svg, .row-phone svg { width: 15px; height: 15px; flex: none; color: var(--gold-p); }
    .row-events { display: flex; flex-wrap: wrap; gap: 6px; }
    .ev-chip { padding: 3px 11px; border: 1px solid var(--line-p); border-radius: 999px; background: rgba(169, 133, 54, .08); font-family: var(--caps); font-size: 13px; font-weight: 600; letter-spacing: .06em; color: var(--ink); }
    .row-phone { display: flex; align-items: center; gap: 7px; font-size: 1rem; color: var(--ink-soft); }
    .sent-toggle { display: flex; align-items: center; gap: 7px; padding: 6px 12px 6px 9px; border: 1px solid var(--line-p); border-radius: 999px; background: var(--paper-2); font-family: var(--caps); font-size: 14px; font-weight: 600; letter-spacing: .1em; color: var(--ink-soft); white-space: nowrap; cursor: pointer; }
    .sent-toggle input { width: 19px; height: 19px; margin: 0; accent-color: #1a8a49; }
    .sent-toggle:has(input:checked) { border-color: #1a8a49; background: #e9f5ec; color: #146c39; }

    /* buttons */
    .row-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .send .btn, .sent-dialog .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 8px 14px; border: 1px solid var(--ink); border-radius: 999px; background: var(--paper-2); color: var(--ink); font: 700 16px var(--serif); letter-spacing: .03em; text-decoration: none; cursor: pointer; }
    .send .btn svg { width: 17px; height: 17px; flex: none; color: var(--gold-p); }
    .send .btn-wa svg { color: #fff; }
    .guest-row.is-sent .row-actions .btn svg { color: inherit; }
    .send .btn-wa { grid-column: 1 / -1; border-color: #137a3e; background: linear-gradient(180deg, #22a85a, #16884a); color: #fff; box-shadow: 0 3px 10px rgba(19, 122, 62, .3); }
    .send .btn:active { transform: translateY(1px); }
    .row-actions .btn { white-space: nowrap; }
    @media (max-width: 379px) { .row-actions .wide { display: none; } }

    /* sent: dimmed, buttons switched off */
    .guest-row.is-sent { background: #f1ebe0; box-shadow: 0 8px 18px rgba(0, 0, 0, .25); }
    .guest-row.is-sent .row-name { color: var(--ink-soft); }
    .guest-row.is-sent .row-name::after { content: " ✓"; color: #1a8a49; }
    .guest-row.is-sent .ev-chip { opacity: .7; }
    .guest-row.is-sent .row-actions .btn { pointer-events: none; cursor: default; border-color: #d6cdbd; background: #e7e0d3; color: #a1968a; box-shadow: none; }

    .hint { max-width: 460px; margin: 26px auto 0; font-size: 15.5px; font-style: italic; line-height: 1.5; text-align: center; color: var(--silk-soft); }
    .notice { margin-top: 30vh; padding: 0 12px; font-size: 1.15rem; font-style: italic; text-align: center; color: var(--silk-soft); }

    /* "Invitation sent to …" */
    .sent-dialog { box-sizing: border-box; width: min(88vw, 360px); padding: 30px 24px 24px; border: 1px solid var(--gold-p); border-radius: 18px; background: radial-gradient(120% 70% at 50% 0%, #fffdf8, var(--paper) 70%); color: var(--ink); text-align: center; box-shadow: inset 0 0 0 5px var(--paper), inset 0 0 0 6px var(--line-p), 0 22px 60px rgba(0, 0, 0, .45); }
    .sent-dialog::backdrop { background: rgba(15, 3, 8, .62); }
    .sent-dialog .sd-mark { display: grid; place-items: center; width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 50%; background: linear-gradient(180deg, #22a85a, #16884a); color: #fff; font-size: 30px; line-height: 1; box-shadow: 0 0 0 4px #fffdf8, 0 0 0 5px var(--gold-p); }
    .sent-dialog .sd-label { margin: 0; font-family: var(--caps); font-size: 13px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-soft); }
    .sent-dialog .sd-name { margin: 6px 0 8px; font-size: 1.6rem; font-weight: 700; line-height: 1.2; }
    .sent-dialog .sd-meta { margin: 0 0 20px; font-size: 1rem; font-style: italic; line-height: 1.4; color: var(--ink-soft); }
    .sent-dialog form { margin: 0; }
    .sent-dialog .btn { min-width: 150px; border-color: var(--ink); background: var(--ink); color: #fff; letter-spacing: .12em; }
  </style>
</head>
<body class="sp">
  <div class="sp-patola" aria-hidden="true"></div>
  <main class="send" id="app"><p class="notice">Opening your guest list…</p></main>
  <div class="sp-patola" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog class="sent-dialog" id="sent-dialog" aria-labelledby="sd-label">
    <div class="sd-mark" aria-hidden="true">✓</div>
    <p class="sd-label" id="sd-label">Invitation sent to</p>
    <p class="sd-name" id="sd-name"></p>
    <p class="sd-meta" id="sd-meta"></p>
    <form method="dialog"><button class="btn" type="submit">OK</button></form>
  </dialog>
  <script src="send.js?v=20261113132751"></script>
</body>
</html>
