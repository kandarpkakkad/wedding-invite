<!doctype html>
<html lang="en" data-theme="burgundy" data-build="20261113131042">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Send invitations</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Cormorant+SC:wght@500;600&display=swap">
  <link rel="stylesheet" href="style.css?v=20261113131042">
  <style>
    .send { max-width: 640px; min-height: 100vh; margin: 0 auto; padding: 28px 16px 64px; background: var(--paper); }
    .send .btn, .sent-dialog .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 8px 12px; border: 1px solid var(--gold); border-radius: 999px; background: var(--paper-2); color: var(--ink); font: 700 15px var(--serif); text-decoration: none; cursor: pointer; }
    .send h1 { margin: 0 0 4px; font-family: var(--caps); font-size: 1.5rem; font-weight: 500; letter-spacing: .06em; text-align: center; color: var(--ink); }
    .summary { margin: 0 0 18px; text-align: center; color: var(--ink-soft); }
    .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
    .tools input[type="search"] { flex: 1 1 220px; min-height: 44px; padding: 8px 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); color: var(--ink); font: inherit; }
    .tools label, .sent-toggle { display: flex; align-items: center; gap: 6px; color: var(--ink-soft); white-space: nowrap; }
    .tools input[type="checkbox"], .sent-toggle input { width: 20px; height: 20px; accent-color: var(--gold-p); }
    .guest-row { display: grid; gap: 12px; margin-bottom: 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
    .guest-row.is-sent { opacity: .62; }
    .row-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .row-name { font-size: 1.18rem; font-weight: 600; line-height: 1.25; }
    .row-meta { font-size: .95rem; line-height: 1.35; color: var(--ink-soft); }
    .row-actions { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; }
    .send .btn-wa { border-color: #1a9e50; background: #1a9e50; color: #fff; }
    /* sent: buttons switched off */
    .guest-row.is-sent .row-actions .btn { pointer-events: none; cursor: default; border-color: #d9d1c3; background: #ece6db; color: #9b917f; }
    .guest-row.is-sent .row-name::after { content: " ✓"; color: #1a9e50; }
    /* "Invitation sent to …" */
    .sent-dialog { width: min(88vw, 360px); padding: 26px 22px 20px; border: 1px solid var(--gold-p); border-radius: 18px; background: var(--paper); color: var(--ink); text-align: center; box-shadow: 0 18px 50px rgba(0, 0, 0, .28); }
    .sent-dialog::backdrop { background: rgba(20, 6, 12, .55); }
    .sent-dialog .sd-mark { display: grid; place-items: center; width: 54px; height: 54px; margin: 0 auto 12px; border-radius: 50%; background: #1a9e50; color: #fff; font-size: 30px; line-height: 1; }
    .sent-dialog .sd-label { margin: 0; font-family: var(--caps); font-size: .95rem; letter-spacing: .08em; color: var(--ink-soft); }
    .sent-dialog .sd-name { margin: 4px 0 6px; font-size: 1.5rem; font-weight: 700; line-height: 1.2; }
    .sent-dialog .sd-meta { margin: 0 0 18px; font-size: .95rem; line-height: 1.35; color: var(--ink-soft); }
    .sent-dialog form { margin: 0; }
    .sent-dialog .btn { min-width: 140px; border-color: var(--ink); background: var(--ink); color: #fff; letter-spacing: .06em; }
    .hint, .notice { color: var(--ink-soft); text-align: center; }
    .notice { margin-top: 30vh; padding: 0 12px; font-size: 1.1rem; }
  </style>
</head>
<body>
  <main class="send paper" id="app"><p class="notice">Opening your guest list…</p></main>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog class="sent-dialog" id="sent-dialog" aria-labelledby="sd-label">
    <div class="sd-mark" aria-hidden="true">✓</div>
    <p class="sd-label" id="sd-label">Invitation sent to</p>
    <p class="sd-name" id="sd-name"></p>
    <p class="sd-meta" id="sd-meta"></p>
    <form method="dialog"><button class="btn" type="submit">OK</button></form>
  </dialog>
  <script src="send.js?v=20261113131042"></script>
</body>
</html>
