<!doctype html>
<html lang="en" data-theme="marigold" data-build="20261112093830">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Send invitations</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Cormorant+SC:wght@500;600&display=swap">
  <link rel="stylesheet" href="style.css?v=20261112093830">
  <style>
    .send { max-width: 640px; min-height: 100vh; margin: 0 auto; padding: 28px 16px 64px; background: var(--paper); }
    .send .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 8px 12px; border: 1px solid var(--gold); border-radius: 999px; background: var(--paper-2); color: var(--ink); font: 700 15px var(--serif); text-decoration: none; cursor: pointer; }
    .send h1 { margin: 0 0 4px; font-family: var(--caps); font-size: 1.5rem; font-weight: 500; letter-spacing: .06em; text-align: center; color: var(--ink); }
    .summary { margin: 0 0 18px; text-align: center; color: var(--ink-soft); }
    .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
    .tools input[type="search"] { flex: 1 1 220px; min-height: 44px; padding: 8px 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); color: var(--ink); font: inherit; }
    .tools label, .sent-toggle { display: flex; align-items: center; gap: 6px; color: var(--ink-soft); white-space: nowrap; }
    .tools input[type="checkbox"], .sent-toggle input { width: 20px; height: 20px; accent-color: var(--gold-p); }
    .guest-row { display: grid; gap: 12px; margin-bottom: 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
    .guest-row.is-sent { opacity: .62; }
    .row-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .row-name { font-size: 1.18rem; font-weight: 600; line-height: 1.25; }
    .row-meta { font-size: .95rem; line-height: 1.35; color: var(--ink-soft); }
    .row-actions { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; }
    .send .btn-wa { border-color: #1a9e50; background: #1a9e50; color: #fff; }
    .hint, .notice { color: var(--ink-soft); text-align: center; }
    .notice { margin-top: 30vh; padding: 0 12px; font-size: 1.1rem; }
  </style>
</head>
<body>
  <main class="send paper" id="app"><p class="notice">Opening your guest list…</p></main>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="send.js?v=20261112093830"></script>
</body>
</html>
